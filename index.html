<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Driving Game Score Calculator</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* GREEN SIDEBANDS (match pygame grass) */
body {
    background: #00ff00;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CENTER PANEL */
.container {
    width: 900px;
    background: rgba(255,255,255,0.95);
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    position: relative;
    z-index: 2;
}

/* ONE-LINE INPUT LAYOUT */
.row {
    display: flex;
    gap: 10px;
    align-items: end;
}

.field {
    flex: 1;
}

label {
    font-weight: bold;
    font-size: 12px;
}

input {
    width: 100%;
    padding: 6px;
    font-size: 14px;
    box-sizing: border-box;
}

button {
    padding: 8px 14px;
    cursor: pointer;
    background: #f4d03f;
    border: none;
    font-weight: bold;
}

button:hover {
    background: #f1c40f;
}

.error {
    color: red;
    margin-top: 10px;
}

.score {
    margin-top: 10px;
    font-size: 18px;
    font-weight: bold;
}

/* ---------------- ROAD SYSTEM ---------------- */

.road-container {
    position: fixed;
    left: 50%;
    top: 0;
    transform: translateX(-50%);
    width: 420px;  /* match pygame track scale */
    height: 100%;
    overflow: hidden;
    z-index: 1;
}

/* full road strip (one tile) */
.road {
    position: absolute;
    width: 100%;
    height: 200%;
    background: #323232;
}

/* lane markings */
.lane-line {
    position: absolute;
    width: 4px;
    height: 40px;
    background: white;
}

/* bumpers */
.bumper {
    position: absolute;
    width: 20px;
    height: 20px;
}

/* animation container */
.scroll {
    position: absolute;
    width: 100%;
    height: 200%;
    animation: scrollUp 2.5s linear infinite;
}

@keyframes scrollUp {
    from { transform: translateY(0); }
    to   { transform: translateY(-50%); }
}
</style>
</head>

<body>

<!-- ROAD -->
<div class="road-container">
    <div class="scroll">

        <!-- TILE 1 -->
        <div class="road" style="top:0%"></div>

        <!-- TILE 2 (duplicate for seamless looping) -->
        <div class="road" style="top:100%"></div>

    </div>
</div>

<!-- UI -->
<div class="container">
    <div class="row">

        <div class="field">
            <label>Collisions</label>
            <input type="text" id="collisions">
        </div>

        <div class="field">
            <label>Playback Speed</label>
            <input type="text" id="speed">
        </div>

        <button onclick="calculateScore()">Calculate</button>
    </div>

    <div class="error" id="error"></div>
    <div class="score" id="score"></div>
</div>

<script>
function calculateScore() {
    const collisionsStr = document.getElementById("collisions").value.trim();
    const speedStr = document.getElementById("speed").value.trim();

    const error = document.getElementById("error");
    const scoreBox = document.getElementById("score");

    error.textContent = "";
    scoreBox.textContent = "";

    // integer validation
    if (!/^[0-9]+$/.test(collisionsStr)) {
        error.textContent = "Collisions must be a positive integer.";
        return;
    }

    const collisions = parseInt(collisionsStr, 10);

    if (collisions < 0) {
        error.textContent = "Collisions must be positive.";
        return;
    }

    // float validation
    if (!/^[0-9]+(\.[0-9]+)?$/.test(speedStr)) {
        error.textContent = "Playback speed must be numeric.";
        return;
    }

    const speed = parseFloat(speedStr);

    if (speed <= 0) {
        error.textContent = "Playback speed must be positive.";
        return;
    }

    if (Math.round(speed * 100) % 5 !== 0) {
        error.textContent = "Playback speed must be in multiples of 0.05.";
        return;
    }

    let score = Math.max(0, 1000 - collisions * 50);
    score = Math.round(score * speed);

    scoreBox.textContent = "Final Score: " + score;
}
</script>

</body>
</html>
